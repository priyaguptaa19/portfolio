name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check every local script, style and image link exists
        run: |
          fail=0
          for f in index.html case.html; do
            for p in $(grep -oE '(src|href)="(js|css|assets)/[^"?#]+' "$f" | sed -E 's/^(src|href)="//'); do
              [ -e "$p" ] || { echo "missing: $p (in $f)"; fail=1; }
            done
          done
          exit $fail
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
